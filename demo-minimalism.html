<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimalism UI Example</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 w-full max-w-sm">
<div class="mb-8">
<h2 class="text-2xl font-bold text-slate-900 mb-1">Welcome back</h2>
<p class="text-sm text-slate-500">Please enter your details to sign in.</p>
</div>
<form class="space-y-5">
<div>
<label class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
<input type="email" placeholder="name@example.com"
class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition-all">
</div>
<div>
<label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
<input type="password" placeholder="••••••••"
class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition-all">
</div>
<button type="submit" class="w-full mt-2 bg-slate-900 hover:bg-black text-white font-semibold py-3 rounded-lg transition-colors">
Sign In
</button>
</form>
</div>
</body>
</html>
