<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Website Resmi - SMP Annida</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Nunito Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet"/>
  
  <style>
    body { font-family: 'Nunito Sans', sans-serif; }
    
    /* Efek Kaca (Glassmorphism) */
    .glass-panel {
      background: rgba(16, 26, 20, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="bg-[url('./assets/images/gedung_sekolah.jpg')] bg-cover bg-center bg-no-repeat bg-fixed min-h-screen text-white flex flex-col">
  
  <!-- Dark Overlay -->
  <div class="fixed inset-0 bg-black/60 z-0"></div>

  <!-- Navbar -->
  <header class="glass-panel sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="#" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
        <img src="./assets/logo/1.png" alt="Logo SMP Annida" class="h-10 w-auto object-contain">
        <span class="text-xl font-bold tracking-wide">SMP ANNIDA</span>
      </a>
      
      <!-- Menu Lengkap sesuai Permintaan -->
      <nav class="hidden lg:flex gap-8 font-semibold text-gray-200">
        <a href="#" class="hover:text-[#10b981] transition-colors duration-200">Profil</a>
        <a href="#" class="hover:text-[#10b981] transition-colors duration-200">Akademik</a>
        <a href="#" class="hover:text-[#10b981] transition-colors duration-200">Kesiswaan</a>
        <a href="#" class="hover:text-[#10b981] transition-colors duration-200">Fasilitas</a>
        <a href="#" class="hover:text-[#10b981] transition-colors duration-200">Berita</a>
      </nav>
      
      <!-- Tombol Navbar Mobile -->
      <div class="lg:hidden flex items-center">
        <button class="text-white hover:text-gray-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Hero -->
  <main class="flex-grow flex items-center justify-center relative z-10 px-4 text-center py-20">
    <div class="max-w-4xl glass-panel p-10 md:p-16 rounded-3xl shadow-2xl">
      <h1 class="text-4xl md:text-6xl font-bold mb-4 leading-tight">
        Selamat Datang di<br><span class="text-[#10b981]">SMP Annida</span>
      </h1>
      <p class="text-lg md:text-xl text-gray-300 mb-10 max-w-2xl mx-auto">
        Unggul, Berkarakter, dan Berlandaskan Nilai Islam. Bergabunglah dengan kami dalam mencetak generasi penerus bangsa.
      </p>
      
      <!-- Akses Cepat (Dua Tombol) -->
      <div class="flex flex-col sm:flex-row gap-5 justify-center">
        
        <!-- Tombol Portal PPDB -->
        <a href="./pages/ppdb/index.html" class="bg-[#10b981] hover:bg-[#059669] text-white font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(16,185,129,0.5)] transition-all transform hover:-translate-y-1 text-lg flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
          Portal PPDB
        </a>
        
        <!-- Tombol Login Pegawai -->
        <a href="./login.html" class="bg-transparent border-2 border-white/50 hover:border-white hover:bg-white/10 text-white font-bold py-3 px-8 rounded-full transition-all text-lg flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
          Login Pegawai
        </a>
        
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="relative z-10 py-6 text-center text-sm text-gray-400 border-t border-white/10 bg-black/40">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>&copy; 2026 SMP Annida. Hak Cipta Dilindungi.</div>
      <div class="flex gap-4">
        <a href="#" class="hover:text-white transition-colors">Instagram</a>
        <a href="#" class="hover:text-white transition-colors">Kontak</a>
      </div>
    </div>
  </footer>

</body>
</html>
