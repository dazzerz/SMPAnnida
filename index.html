<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Website Resmi - SMP Annida</title>
  
  <!-- Tailwind CSS & Fonts (Identik dengan halaman PPDB) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet"/>
  
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#10b981",
            "primary-dim": "#059669",
          },
          fontFamily: {
            "headline-md": ["Literata"],
            "body-md": ["Nunito Sans"]
          }
        }
      }
    }
  </script>
  <style>
    .bg-hero {
      background-image: url('./assets/images/gedung_sekolah.jpg');
    }
    .glass-panel-custom {
      background: rgba(16, 26, 20, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="bg-hero bg-cover bg-center bg-fixed text-white font-body-md min-h-screen flex flex-col">

  <!-- Lapisan Gelap (Overlay) -->
  <div class="fixed inset-0 bg-black/60 z-0"></div>

  <!-- Navbar -->
  <header class="bg-black/30 backdrop-blur-md border-b border-white/10 w-full top-0 z-50 sticky shadow-sm">
    <div class="flex justify-between items-center px-6 py-4 w-full max-w-7xl mx-auto">
      <a class="flex items-center gap-3 font-headline-md text-2xl font-bold text-white hover:opacity-90 transition-opacity" href="#">
        <img src="./assets/logo/1.png" alt="Logo SMP Annida" class="h-10 w-auto object-contain">
        <span>SMP Annida</span>
      </a>
      <nav class="hidden lg:flex gap-8">
        <a class="text-gray-300 hover:text-primary transition-colors duration-200 font-semibold" href="#">Profil</a>
        <a class="text-gray-300 hover:text-primary transition-colors duration-200 font-semibold" href="#">Akademik</a>
        <a class="text-gray-300 hover:text-primary transition-colors duration-200 font-semibold" href="#">Kesiswaan</a>
        <a class="text-gray-300 hover:text-primary transition-colors duration-200 font-semibold" href="#">Fasilitas</a>
        <a class="text-gray-300 hover:text-primary transition-colors duration-200 font-semibold" href="#">Berita</a>
      </nav>
    </div>
  </header>

  <!-- Hero Content -->
  <main class="flex-grow flex items-center justify-center relative z-10 px-4 py-16">
    <div class="glass-panel-custom p-10 md:p-16 rounded-3xl text-center max-w-4xl">
      <h1 class="font-headline-md text-4xl md:text-6xl font-bold mb-4 leading-tight">
        Website Resmi <br><span class="text-primary">SMP Annida</span>
      </h1>
      <p class="text-lg md:text-xl text-gray-200 mb-10 max-w-2xl mx-auto leading-relaxed">
        Membangun Generasi Cerdas, Berkarakter, dan Unggul Berlandaskan Nilai Islam.
      </p>

      <!-- CTA Buttons -->
      <div class="flex flex-col sm:flex-row justify-center gap-5">
        <a href="./pages/ppdb/index.html" class="bg-primary hover:bg-primary-dim text-white font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(16,185,129,0.5)] transition-all transform hover:-translate-y-1 text-lg">
          Daftar PPDB Sekarang
        </a>
        <a href="./login.html" class="bg-transparent border-2 border-white/40 hover:border-white hover:bg-white/10 text-white font-bold py-3 px-8 rounded-full transition-all text-lg">
          Login Pegawai
        </a>
      </div>
    </div>
  </main>

  <footer class="relative z-10 py-6 text-center text-sm text-gray-400 bg-black/40 border-t border-white/10">
    &copy; 2026 SMP Annida. Hak Cipta Dilindungi.
  </footer>
</body>
</html>
