<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SMP Annida</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }

    /* 1. CONTAINER UTAMA (Background Gedung) */
    .hero-container {
      position: relative;
      width: 100vw; 
      height: 100vh;
      /* GANTI DENGAN FOTO GEDUNG */
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 40%), url('assets/images/gedung_sekolah.jpg') center center / cover no-repeat;
      display: flex;
      align-items: flex-end; /* Bawa teks ke bawah */
      overflow: hidden;
    }

    /* 2. TEKS KIRI BAWAH */
    .hero-text {
      width: 50%;
      padding: 4rem 5rem;
      color: white;
      z-index: 2;
    }
    .hero-text h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 1rem; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }
    .hero-text p { font-size: 1.2rem; opacity: 0.9; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

    /* 3. PANEL KANAN MELENGKUNG (Daun) */
    .curved-panel {
      position: absolute;
      right: 0; top: 0;
      width: 45vw; /* Lebar panel kanan */
      height: 100vh;
      /* GANTI DENGAN FOTO DAUN */
      background: url('assets/images/bg-utama.jpeg') center / cover no-repeat;
      
      /* RAHASIA LEKUKAN ORGANIK */
      border-top-left-radius: 20% 50%;
      border-bottom-left-radius: 20% 50%;
      box-shadow: -15px 0 40px rgba(0,0,0,0.6); /* Bayangan memisah panel */
      
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem;
    }

    /* 4. KARTU LOGIN (Neon Glassmorphism) */
    .glass-login {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 20, 15, 0.65); /* Sangat gelap */
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      color: white;
    }

    /* 5. EFEK GLOWING INPUT & TOMBOL */
    .glass-login input {
      width: 100%; padding: 14px; margin-bottom: 1.5rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px; color: white; outline: none;
      transition: all 0.3s ease;
    }
    .glass-login input:focus {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.5); /* Glowing Neon Hijau */
    }

    .glass-login button {
      width: 100%; padding: 14px;
      background: #16a34a; color: white;
      border: none; border-radius: 50px; font-weight: bold; font-size: 1.1rem;
      box-shadow: 0 0 20px rgba(22, 163, 74, 0.5); /* Glowing Tombol */
      cursor: pointer; transition: 0.3s;
    }
    .glass-login button:hover {
      background: #15803d;
      box-shadow: 0 0 25px rgba(22, 163, 74, 0.8);
    }

    /* Secondary Action Button styling (Outline style) */
    .glass-login button.btn-guest {
      background: transparent !important;
      color: #22c55e !important;
      border: 1px solid #22c55e !important;
      box-shadow: none !important;
      margin-top: 0;
    }
    .glass-login button.btn-guest:hover {
      background: rgba(34, 197, 94, 0.1) !important;
      box-shadow: none !important;
    }

    /* Logo and Header text alignment */
    .login-header {
       display: flex;
       align-items: center;
       gap: 15px; /* Jarak proporsional antara logo dan teks */
       margin-bottom: 2rem;
    }
    .login-header img {
       width: 45px; /* Ukuran logo disesuaikan */
       height: auto;
       object-fit: contain;
    }
    .login-header h2 {
       font-size: 1.6rem;
       font-weight: 700;
       color: #ffffff;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .curved-panel {
        width: 50vw;
      }
      .hero-text {
        width: 50%;
        padding: 3rem;
      }
      .hero-text h1 {
        font-size: 2.8rem;
      }
    }

    @media (max-width: 900px) {
      .hero-container {
        flex-direction: column;
        justify-content: flex-start;
      }
      .hero-text {
        width: 100%;
        height: 35vh;
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }
      .hero-text h1 {
        font-size: 2.2rem;
      }
      .hero-text p {
        font-size: 1rem;
      }
      .curved-panel {
        position: relative;
        width: 100% !important;
        height: 65vh;
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
        box-shadow: 0 -15px 40px rgba(0,0,0,0.6);
        padding: 1.5rem !important;
      }
      .glass-login {
        padding: 30px 20px;
        max-width: 380px;
      }
    }
  </style>
  <script type="module">
    import { handleLogin } from './js/core/auth.js?v=2';
    
    document.addEventListener('DOMContentLoaded', () => {
      const submitBtn = document.querySelector('.btn-submit');
      if (submitBtn) {
        submitBtn.addEventListener('click', handleLogin);
      }
      
      const guestBtn = document.querySelector('.btn-guest');
      if (guestBtn) {
        guestBtn.addEventListener('click', () => {
          sessionStorage.setItem('guest_mode_active', 'true');
          localStorage.setItem('isGuest', 'true');
          window.location.href = 'pages/academic/dashboard.html';
        });
      }
    });
  </script>
</head>
<body>

  <div class="hero-container">
    
    <!-- LEFT TEXT -->
    <div class="hero-text">
      <h1>Selamat Datang di<br>Portal SMP Annida</h1>
      <p>Akses terpadu untuk layanan akademik dan<br>administrasi sekolah.</p>
    </div>

    <!-- CURVED PANEL RIGHT -->
    <div class="curved-panel">
      <div class="glass-login">
        
        <div class="login-header">
           <img src="assets/logo/1.png" alt="Logo Annida">
           <h2>SMPAnnida Portal</h2>
        </div>
        
        <p style="font-size: 0.85rem; opacity: 0.7; margin-bottom: 2rem; margin-top: -1rem; text-align: left;">Silakan masuk menggunakan akun Anda.</p>
        
        <div id="auth-message"></div>

        <form>
          <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; opacity: 0.8; text-align: left;">Email</label>
          <input type="email" placeholder="admin@smpannida.com">
          
          <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; opacity: 0.8; text-align: left;">Password</label>
          <input type="password" placeholder="••••••••">
          
          <button type="button" class="btn-submit" style="margin-bottom: 1rem;">Masuk</button>
          
          <div style="text-align: center; margin: 15px 0; opacity: 0.5; font-size: 0.85rem;">Atau</div>
          
          <button type="button" class="btn-guest">Masuk Tanpa Login (Guest)</button>
        </form>

      </div>
    </div>

  </div>

</body>
</html>
