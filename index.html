<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SMPAnnida Super App</title>
  <meta name="description" content="Satu gerbang untuk PPDB, Akademik, dan Keuangan." />
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .login-logo { height: 90px; width: auto; margin-bottom: 1rem; display: block; margin-left: auto; margin-right: auto; object-fit: contain; }
    .login-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: white;
    }
    .login-subtitle {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    #google-login-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      border-radius: 50px;
      margin-bottom: 1rem;
    }
    .divider {
      margin: 1.5rem 0;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
      margin: 0 1rem;
    }
    .auth-message {
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .auth-message.show { display: block; }
    .auth-message.error { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5; }
    .auth-message.success { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); color: #86efac; }
  
    /* =========================================================================
       CLEAN SPLIT-SCREEN PORTAL LAYOUT
       ========================================================================= */
    .hero-annida {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    .split-left {
      width: 45%;
      background-image: url('assets/images/gedung_sekolah.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .split-right {
      width: 55%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      overflow-y: auto;
    }

    /* Minimalist Portal Login Card Container (Blending with White Background) */
    .hero-annida .login-card {
      width: 100%;
      max-width: 380px;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      padding: 0 !important;
      margin: 0;
    }

    .hero-annida .login-logo {
      height: 60px;
      width: auto;
      margin-bottom: 1.5rem;
      display: block;
      object-fit: contain;
      margin-left: 0; /* Left align on split screen */
    }

    .hero-annida .login-title {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a !important; /* Dark Slate */
      margin-bottom: 0.5rem;
      text-align: left;
    }
    
    .hero-annida .login-subtitle {
      color: #475569 !important; /* Slate Grey */
      margin-bottom: 2rem;
      text-align: left;
      font-size: 1rem;
    }

    .divider {
      margin: 1.5rem 0;
      color: #94a3b8;
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
      margin: 0 1rem;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .split-left {
        display: none !important; /* Hide image section on mobile */
      }
      .split-right {
        width: 100% !important;
        padding: 30px 20px;
      }
      .hero-annida .login-card {
        padding: 10px !important;
      }
    }

  </style>
<link rel="stylesheet" href="./css/mobile.css" />
</head>
<body>
  <section class="hero-annida">
    <!-- Left Side: Clean Natural Image -->
    <div class="split-left"></div>

    <!-- Right Side: Clean White Login Form -->
    <div class="split-right">
      <div class="login-card">
        <img src="1.png" alt="Logo Annida" class="login-logo">
        <h1 class="login-title">Selamat Datang</h1>
        <p class="login-subtitle">Masuk ke Portal Terpadu SMP Annida untuk mengakses PPDB, Akademik & Kesiswaan, serta Keuangan.</p>
        
        <div id="auth-message"></div>

        <form id="login-form">
          <div style="margin-bottom: 1.2rem; text-align: left;">
            <label style="display: block; margin-bottom: 0.5rem; color: #475569; font-weight: 500; font-size: 0.9rem;">Email</label>
            <input type="email" id="login-email" required placeholder="admin@smpannida.com" style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; font-size: 1rem; transition: border-color 0.2s;" onfocus="this.style.borderColor='#00c853'" onblur="this.style.borderColor='#cbd5e1'">
          </div>
          <div style="margin-bottom: 1.5rem; text-align: left;">
            <label style="display: block; margin-bottom: 0.5rem; color: #475569; font-weight: 500; font-size: 0.9rem;">Password</label>
            <input type="password" id="login-password" required placeholder="*********" style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; font-size: 1rem; transition: border-color 0.2s;" onfocus="this.style.borderColor='#00c853'" onblur="this.style.borderColor='#cbd5e1'">
          </div>
          <button type="submit" class="btn btn-primary" id="login-btn" style="width: 100%; padding: 0.9rem; font-size: 1.05rem; border-radius: 8px; margin-bottom: 1rem; background-color: #00c853; color: white; border: none; font-weight: 600; cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#009624'" onmouseout="this.style.backgroundColor='#00c853'">
            Masuk
          </button>
        </form>

        <div class="divider">Atau</div>

        <button class="btn btn-outline" style="width: 100%; padding: 0.9rem; border-radius: 8px; border: 1px solid #cbd5e1; background: transparent; color: #475569; font-weight: 500; font-size: 1rem; cursor: pointer; transition: all 0.2s;" id="guest-login-btn" onmouseover="this.style.backgroundColor='#f1f5f9'" onmouseout="this.style.backgroundColor='transparent'">
          Masuk Tanpa Login (Guest)
        </button>
      </div>
    </div>
  </section>

  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    import { handleLogin } from './js/core/auth.js?v=2';
    
    document.getElementById('login-form').addEventListener('submit', handleLogin);
    
    // Fallback for guest login
    const guestBtn = document.getElementById('guest-login-btn');
    if (guestBtn) {
      guestBtn.addEventListener('click', () => {
        sessionStorage.setItem('guest_mode_active', 'true');
        localStorage.setItem('isGuest', 'true');
        window.location.href = 'pages/academic/dashboard.html';
      });
    }
  </script>
</body>
</html>
