<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SMPAnnida Super App</title>
  <meta name="description" content="Satu gerbang untuk PPDB, Akademik, dan Keuangan." />
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .login-logo { height: 90px; width: auto; margin-bottom: 1rem; display: block; margin-left: auto; margin-right: auto; object-fit: contain; }
    .login-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: white;
    }
    .login-subtitle {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    #google-login-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      border-radius: 50px;
      margin-bottom: 1rem;
    }
    .divider {
      margin: 1.5rem 0;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
      margin: 0 1rem;
    }
    .auth-message {
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .auth-message.show { display: block; }
    .auth-message.error { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5; }
    .auth-message.success { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); color: #86efac; }
  
    /* =========================================================================
       CLEAN 2-COLUMN PORTAL LAYOUT
       ========================================================================= */
    .hero-annida {
      min-height: 100vh;
      width: 100%;
      position: relative;
      background-image: 
        linear-gradient(rgba(10, 18, 14, 0.55), rgba(10, 18, 14, 0.55)),
        url('assets/images/gedung_sekolah.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portal-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
      gap: 4rem;
      z-index: 5;
    }

    .portal-left {
      flex: 1.2;
      color: #ffffff;
      text-align: left;
    }

    .portal-left h2 {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1.2rem;
      color: #ffffff !important;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
    }

    .portal-left p {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.85) !important;
      line-height: 1.6;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .portal-right {
      flex: 0.8;
      display: flex;
      justify-content: flex-end;
    }

    /* Portal Login Card Container */
    .hero-annida .login-card {
      width: 100%;
      max-width: 380px;
      background: rgba(15, 23, 42, 0.5) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 24px !important;
      padding: 2.2rem !important;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4) !important;
      margin: 0;
      transition: transform 0.3s ease;
    }

    .hero-annida .login-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: white;
    }
    .hero-annida .login-subtitle {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .portal-container {
        flex-direction: column;
        justify-content: center;
        gap: 2.5rem;
        text-align: center;
        padding: 4rem 1.5rem;
      }
      .portal-left {
        text-align: center;
      }
      .portal-left h2 {
        font-size: 2.2rem;
      }
      .portal-right {
        justify-content: center;
        width: 100%;
      }
    }

  </style>
<link rel="stylesheet" href="./css/mobile.css" />
</head>
<body>
  <section class="hero-annida">
    <div class="portal-container">
      <!-- Left Side: Welcoming Text -->
      <div class="portal-left">
        <h2>Selamat Datang di Portal Terpadu SMP Annida</h2>
        <p>Satu gerbang akses terintegrasi untuk layanan Penerimaan Peserta Didik Baru (PPDB), Akademik & Kesiswaan, serta administrasi Keuangan sekolah.</p>
      </div>

      <!-- Right Side: Login Form -->
      <div class="portal-right">
        <div class="glass-panel login-card">
          <img src="1.png" alt="Logo Annida" class="login-logo">
          <h1 class="login-title">SMPAnnida Portal</h1>
          <p class="login-subtitle">Silakan masuk menggunakan akun Anda.</p>
          
          <div id="auth-message"></div>

          <form id="login-form">
            <div style="margin-bottom: 1rem; text-align: left;">
              <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Email</label>
              <input type="email" id="login-email" required placeholder="admin@smpannida.com" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white;">
            </div>
            <div style="margin-bottom: 1.5rem; text-align: left;">
              <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Password</label>
              <input type="password" id="login-password" required placeholder="*********" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white;">
            </div>
            <button type="submit" class="btn btn-primary" id="login-btn" style="width: 100%; padding: 1rem; font-size: 1.1rem; border-radius: 50px; margin-bottom: 1rem;">
              Masuk
            </button>
          </form>

          <div class="divider">Atau</div>

          <button class="btn btn-outline" style="width:100%;padding:1rem;border-radius:50px;" id="guest-login-btn">
            Masuk Tanpa Login (Guest)
          </button>
        </div>
      </div>
    </div>
  </section>

  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    import { handleLogin } from './js/core/auth.js?v=2';
    
    document.getElementById('login-form').addEventListener('submit', handleLogin);
    
    // Fallback for guest login
    const guestBtn = document.getElementById('guest-login-btn');
    if (guestBtn) {
      guestBtn.addEventListener('click', () => {
        sessionStorage.setItem('guest_mode_active', 'true');
        localStorage.setItem('isGuest', 'true');
        window.location.href = 'pages/academic/dashboard.html';
      });
    }
  </script>
</body>
</html>
