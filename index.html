<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SMPAnnida Super App</title>
  <meta name="description" content="Satu gerbang untuk PPDB, Akademik, dan Keuangan." />
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .login-logo { height: 90px; width: auto; margin-bottom: 1rem; display: block; margin-left: auto; margin-right: auto; object-fit: contain; }
    .login-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: white;
    }
    .login-subtitle {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    #google-login-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      border-radius: 50px;
      margin-bottom: 1rem;
    }
    .divider {
      margin: 1.5rem 0;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
      margin: 0 1rem;
    }
    .auth-message {
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .auth-message.show { display: block; }
    .auth-message.error { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5; }
    .auth-message.success { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); color: #86efac; }
  
    /* =========================================================================
       HERO ANNIDA PORTAL OVERHAUL
       ========================================================================= */
    .hero-annida {
      height: 100vh;
      width: 100%;
      position: relative;
      overflow: hidden;
      background-image: 
        linear-gradient(to top, rgba(10, 18, 14, 0.95) 0%, rgba(10, 18, 14, 0.4) 40%, rgba(10, 18, 14, 0) 80%),
        url('assets/images/gedung_sekolah.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
    }

    /* Giant Title in Sky */
    .hero-title-annida {
      position: absolute;
      top: 8vh;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8vw;
      font-weight: 900;
      letter-spacing: 1.5rem;
      color: rgba(255, 255, 255, 0.18);
      text-transform: uppercase;
      user-select: none;
      pointer-events: none;
      text-align: center;
      width: 100%;
      padding-left: 1.5rem; /* Offset letter-spacing at the end */
    }

    /* Floating Tooltips */
    .annida-tooltip {
      position: absolute;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 10px 20px;
      border-radius: 30px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: default;
      z-index: 5;
    }
    .annida-tooltip:hover {
      transform: translateY(-5px) scale(1.05);
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 12px 40px 0 rgba(124, 237, 80, 0.3);
    }
    .annida-tooltip i {
      color: var(--accent-primary, #7ced50);
      font-size: 1.1rem;
    }

    /* Portal Login Card Container */
    .hero-annida .login-card {
      position: absolute;
      right: 5vw;
      bottom: 8vh;
      width: 100%;
      max-width: 420px;
      background: rgba(10, 18, 14, 0.7) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 24px !important;
      padding: 2.5rem !important;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5) !important;
      margin: 0;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .annida-tooltip {
        padding: 8px 14px;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 768px) {
      .hero-title-annida {
        font-size: 12vw;
        letter-spacing: 0.8rem;
        top: 12vh;
      }
      .annida-tooltip {
        display: none !important; /* Hide tooltips on mobile to avoid clutter */
      }
      .hero-annida .login-card {
        right: 50% !important;
        bottom: 5vh !important;
        transform: translateX(50%);
        width: 90% !important;
        max-width: 400px;
        padding: 2rem !important;
      }
    }

  </style>
<link rel="stylesheet" href="./css/mobile.css" />
</head>
<body>
  <section class="hero-annida">
    <!-- Giant Title in Sky -->
    <div class="hero-title-annida">ANNIDA</div>

    <!-- Floating Glassmorphism Tooltips -->
    <div class="annida-tooltip" style="top: 35%; left: 12%;">
      <i class="ph ph-mosque"></i>
      <span>Program Tahfidz 🕋</span>
    </div>
    <div class="annida-tooltip" style="top: 48%; left: 25%;">
      <i class="ph ph-tree"></i>
      <span>Sekolah Alam 🌳</span>
    </div>
    <div class="annida-tooltip" style="top: 25%; left: 52%;">
      <i class="ph ph-projector-screen"></i>
      <span>Fasilitas Modern 🏫</span>
    </div>
    <div class="annida-tooltip" style="top: 55%; left: 45%;">
      <i class="ph ph-book-open"></i>
      <span>Kurikulum Merdeka 📚</span>
    </div>

    <!-- Portal Login Card (Bottom Right) -->
    <div class="glass-panel login-card">
      <img src="1.png" alt="Logo Annida" class="login-logo">
      <h1 class="login-title">SMPAnnida Portal</h1>
      <p class="login-subtitle">Satu gerbang untuk Akademik, PPDB, dan Keuangan.</p>
      
      <div id="auth-message"></div>

      <form id="login-form">
        <div style="margin-bottom: 1rem; text-align: left;">
          <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Email</label>
          <input type="email" id="login-email" required placeholder="admin@smpannida.com" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white;">
        </div>
        <div style="margin-bottom: 1.5rem; text-align: left;">
          <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Password</label>
          <input type="password" id="login-password" required placeholder="*********" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: white;">
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn" style="width: 100%; padding: 1rem; font-size: 1.1rem; border-radius: 50px; margin-bottom: 1rem;">
          Masuk
        </button>
      </form>

      <div class="divider">Atau</div>

      <button class="btn btn-outline" style="width:100%;padding:1rem;border-radius:50px;" id="guest-login-btn">
        Masuk Tanpa Login (Guest)
      </button>
    </div>
  </section>

  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    import { handleLogin } from './js/core/auth.js?v=2';
    
    document.getElementById('login-form').addEventListener('submit', handleLogin);
    
    // Fallback for guest login
    const guestBtn = document.getElementById('guest-login-btn');
    if (guestBtn) {
      guestBtn.addEventListener('click', () => {
        sessionStorage.setItem('guest_mode_active', 'true');
        localStorage.setItem('isGuest', 'true');
        window.location.href = 'pages/academic/dashboard.html';
      });
    }
  </script>
</body>
</html>
