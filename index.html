<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SMP Annida</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { overflow: hidden; background: #000; }
    
    .split-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* === KOLOM KIRI: FOTO GEDUNG SAJA === */
    .left-panel {
      flex: 1; /* Mengambil sisa ruang layar */
      /* Ganti nama file gedung di bawah ini */
      background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.1) 100%), 
                  url('assets/images/gedung_sekolah.jpg') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5rem;
      color: white;
    }

    .left-panel h1 { font-size: 3.5rem; margin-bottom: 1rem; line-height: 1.2; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    .left-panel p { font-size: 1.2rem; max-width: 500px; line-height: 1.6; opacity: 0.9; }

    /* === KOLOM KANAN: BACKGROUND DAUN + KACA === */
    .right-panel {
      width: 450px; /* Lebar panel form tetap */
      /* Ganti nama file dedaunan di bawah ini */
      background: url('assets/images/bg-utama.jpeg') center center / cover no-repeat;
    }

    /* Efek Kaca Full dari atas ke bawah */
    .glass-overlay {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem;
      background: rgba(10, 26, 15, 0.6); /* Hijau gelap transparan */
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      color: white;
    }

    /* Styling Form Login (Sederhana & Elegan) */
    .text-center { text-align: center; margin-bottom: 2rem; }
    .text-center img { width: 60px; margin-bottom: 1rem; }
    
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; opacity: 0.8; }
    .form-group input {
      width: 100%; padding: 12px 15px; border-radius: 8px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: white; outline: none;
    }
    .form-group input:focus { border-color: #00c853; }
    
    .btn-submit {
      width: 100%; padding: 14px; border-radius: 8px; font-weight: bold;
      background: #00c853; color: white; border: none; cursor: pointer; margin-bottom: 1rem;
      transition: background-color 0.2s;
    }
    .btn-submit:hover { background: #009624; }
    .btn-guest {
      width: 100%; padding: 14px; border-radius: 8px; font-weight: bold;
      background: transparent; color: #00c853; border: 1px solid #00c853; cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-guest:hover { background: rgba(0, 200, 83, 0.1); }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .split-layout {
        flex-direction: column;
      }
      .left-panel {
        flex: auto;
        width: 100% !important;
        height: 35vh;
        padding: 2rem 1.5rem;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .left-panel h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      .left-panel p {
        font-size: 0.95rem;
        max-width: 100%;
      }
      .right-panel {
        flex: auto;
        width: 100% !important;
        height: 65vh;
        min-width: 100%;
      }
      .glass-overlay {
        padding: 2rem 1.5rem;
      }
    }
  </style>
  <script type="module">
    import { handleLogin } from './js/core/auth.js?v=2';
    
    document.addEventListener('DOMContentLoaded', () => {
      const submitBtn = document.querySelector('.btn-submit');
      if (submitBtn) {
        submitBtn.addEventListener('click', handleLogin);
      }
      
      const guestBtn = document.querySelector('.btn-guest');
      if (guestBtn) {
        guestBtn.addEventListener('click', () => {
          sessionStorage.setItem('guest_mode_active', 'true');
          localStorage.setItem('isGuest', 'true');
          window.location.href = 'pages/academic/dashboard.html';
        });
      }
    });
  </script>
</head>
<body>

  <div class="split-layout">
    
    <!-- KOLOM KIRI -->
    <div class="left-panel">
      <h1>Selamat Datang<br>di Portal SMP Annida</h1>
      <p>Gerbang utama layanan akademik, PPDB, dan administrasi keuangan bagi generasi Qur'ani.</p>
    </div>

    <!-- KOLOM KANAN -->
    <div class="right-panel">
      <div class="glass-overlay">
        
        <div class="text-center">
          <img src="assets/logo/1.png" alt="Logo Annida">
          <h2>SMPAnnida Portal</h2>
          <p style="font-size: 0.8rem; opacity: 0.7; margin-top: 5px;">Silakan masuk menggunakan akun Anda.</p>
        </div>

        <form>
          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="admin@smpannida.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="••••••••">
          </div>
          <button type="button" class="btn-submit">Masuk</button>
          <div style="text-align: center; margin: 10px 0; opacity: 0.5; font-size: 0.8rem;">Atau</div>
          <button type="button" class="btn-guest">Masuk Tanpa Login (Guest)</button>
        </form>

      </div>
    </div>

  </div>

</body>
</html>
