<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun - Annida2PPDB</title>
  <link rel="stylesheet" href="../../css/style.css" />
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    
    
    <!-- Supabase SDK & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../js/supabase-config.js" defer></script>
</head>
<body class="bg-light">
    <header class="navbar">
        <div class="container">
            <div class="logo">
                <a href="../index.html" class="logo-link">
                    <img src="../assets/logo/1.png" alt="Logo Annida2PPDB" class="logo-icon">
                    <span class="logo-text">Annida2PPDB</span>
                </a>
            </div>
            <nav class="nav-links">
                <a href="../pages/about.html">Tentang Kami</a>
                <a href="../index.html" class="btn btn-outline">Kembali ke Beranda</a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-card" style="max-width: 500px;">
            <div class="auth-header">
                <h2>Registrasi Akun</h2>
                <p>Mulai langkah Anda bergabung bersama Annida2PPDB</p>
            </div>
            <form action="#" method="POST" id="registerForm">
                <div class="form-group">
                    <label for="fullname">Nama Lengkap Orang Tua/Wali</label>
                    <input type="text" id="fullname" name="fullname" class="form-control" placeholder="Nama lengkap sesuai KTP" required>
                </div>
                <div class="form-group">
                    <label for="phone">Nomor WhatsApp Aktif</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="08xxxxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Contoh: user@email.com" required>
                </div>
                
                <!-- Pondok vs Sekolah Saja Option -->
                <div class="form-group">
                    <label for="tipe_pendaftaran">Tipe Pendaftaran</label>
                    <select id="tipe_pendaftaran" name="tipe_pendaftaran" class="form-control" required>
                        <option value="sekolah">Hanya Sekolah (Non-Pondok)</option>
                        <option value="pondok">Sekolah + Pondok (Boarding)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Buat password (minimal 8 karakter)" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">Daftar Akun Baru</button>
                
                <div class="form-footer">
                    <p>Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Annida2PPDB Management System.</p>
        </div>
    </footer>

</body>
</html>
