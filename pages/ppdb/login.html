<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Annida2PPDB</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    /* =========================================================================
       CLEAN SPLIT-SCREEN GLASSMORPHISM PORTAL LAYOUT (SPLIT PANEL)
       ========================================================================= */
    .login-page {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* SISI KIRI (GEDUNG) */
    .login-left {
      flex: 65%; /* Mengambil 65% lebar layar */
      position: relative;
      background: url('../../assets/images/gedung_sekolah.jpg') center center / cover no-repeat;
      display: flex;
      align-items: center;
      padding: 5rem;
    }

    /* Gradient tipis di kiri agar teks sapaan putih tetap terbaca */
    .login-left::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 100%);
    }

    .left-content {
      position: relative;
      z-index: 2;
      color: white;
    }

    .login-left h1 {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      text-shadow: 0 2px 15px rgba(0,0,0,0.5);
      color: #ffffff !important;
    }

    .login-left p {
      font-size: 1.15rem;
      color: rgba(255,255,255,0.85) !important;
      max-width: 460px;
      line-height: 1.6;
    }

    /* SISI KANAN (DAUN & KACA) */
    .login-right {
      flex: 35%; /* Mengambil 35% lebar layar */
      min-width: 450px;
      height: 100vh; /* Full dari atas ke bawah */
      background: url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?w=1920&q=80') center center / cover no-repeat;
    }

    /* Efek Kaca (Glassmorphism) yang menutupi full sisi kanan */
    .login-panel-glass {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem;
      background: rgba(10, 26, 15, 0.45); /* Warna hijau sangat gelap transparan */
      backdrop-filter: blur(15px); /* Efek kaca buram */
      -webkit-backdrop-filter: blur(15px);
      color: white;
    }

    /* Pastikan input form dalam .login-panel-glass juga mendukung tema gelap/kaca */
    .login-panel-glass input {
      background: rgba(255,255,255,0.1) !important;
      border: 1px solid rgba(255,255,255,0.3) !important;
      color: white !important;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }
    .login-panel-glass input::placeholder {
      color: rgba(255,255,255,0.4) !important;
    }
    .login-panel-glass input:focus {
      border-color: #00c853 !important;
      box-shadow: 0 0 0 3px rgba(0,200,83,0.2) !important;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: #00c853;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-login:hover {
      background-color: #009624;
    }

    .divider {
      margin: 20px 0;
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 1rem;
    }

    .btn-guest {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #00c853;
      border: 1px solid #00c853;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-guest:hover {
      background: rgba(0, 200, 83, 0.1);
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .login-page {
        flex-direction: column;
      }
      .login-left {
        flex: auto;
        width: 100% !important;
        height: 35vh;
        padding: 2rem 1.5rem;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .login-left h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      .login-left p {
        font-size: 0.95rem;
        max-width: 100%;
      }
      .login-right {
        flex: auto;
        width: 100% !important;
        height: 65vh;
        min-width: 100%;
      }
      .login-panel-glass {
        padding: 2rem 1.5rem;
      }
    }
  </style>
  <link rel="stylesheet" href="../../css/mobile.css" />
  <script type="module">
    import { setupThemeToggle, applySavedTheme } from '../../js/core/utils.js';
    applySavedTheme();
    setupThemeToggle();
  </script>
</head>
<body>
<div class="login-page">
  <!-- Sisi Kiri: Foto Gedung & Sapaan -->
  <div class="login-left">
    <div class="left-content">
      <h1>Selamat Datang<br>di Portal PPDB SMP Annida</h1>
      <p>Silakan masuk menggunakan akun pendaftaran Anda untuk melanjutkan registrasi calon siswa baru SMP Annida.</p>
    </div>
  </div>

  <!-- Sisi Kanan: Panel Login Full Tinggi dengan Background Daun -->
  <div class="login-right">
    <div class="login-panel-glass">
      <img src="../../1.png" alt="Logo" style="width:60px; margin-bottom:16px; margin-left: auto; margin-right: auto; display: block; object-fit: contain;">
      <h2 style="color: #ffffff; margin-bottom: 4px; text-align: center; font-size: 1.6rem; font-weight: 700;">PPDB Portal</h2>
      <p style="margin-bottom:24px; opacity:0.7; text-align: center; font-size: 0.95rem;">Silakan masuk ke portal Annida2PPDB.</p>
      
      <div id="auth-message"></div>

      <form>
        <label style="display: block; text-align: left; margin-bottom: 6px; margin-top: 16px; font-size: 0.9rem; color: rgba(255,255,255,0.8);">Alamat Email</label>
        <input type="email" placeholder="user@email.com atau admin@annida.com">
        <label style="display: block; text-align: left; margin-bottom: 6px; margin-top: 16px; font-size: 0.9rem; color: rgba(255,255,255,0.8);">Password</label>
        <input type="password" placeholder="Masukkan password Anda">
        <button type="submit" class="btn-login">Masuk</button>
        <div class="divider"><span>Atau</span></div>
        <button type="button" class="btn-guest" onclick="window.location.href='register.html'">Daftar Sekarang</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
