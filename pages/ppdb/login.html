<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Annida2PPDB</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    /* =========================================================================
       PREMIUM GLASSMORPHISM PORTAL LAYOUT
       ========================================================================= */
    .hero-annida {
      min-height: 100vh;
      width: 100%;
      position: relative;
      background: url('../../assets/images/gedung_sekolah.jpg') center bottom / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: flex-end; /* Align to the right */
      padding-right: 8vw;
    }

    .hero-overlay-annida {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
    }

    /* Portal Login Card Container (Layer 2) */
    .hero-annida .login-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.05) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      border-radius: 24px !important;
      padding: 40px !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3) !important;
      color: #ffffff !important;
      margin: 0;
    }

    .hero-annida .login-logo {
      height: 70px;
      width: auto;
      margin-bottom: 1.5rem;
      display: block;
      object-fit: contain;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-annida .login-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff !important;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    
    .hero-annida .login-subtitle {
      color: rgba(255, 255, 255, 0.7) !important;
      margin-bottom: 2rem;
      text-align: center;
      font-size: 0.95rem;
    }

    .hero-annida label {
      color: #ffffff !important;
      font-weight: 500;
    }

    .hero-annida input {
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      color: white !important;
      border-radius: 8px !important;
      font-size: 1rem;
    }
    
    .hero-annida input::placeholder {
      color: rgba(255, 255, 255, 0.6) !important;
    }

    .hero-annida .btn-primary {
      background-color: #00c853 !important;
      color: white !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .hero-annida .btn-primary:hover {
      background-color: #5efc82 !important;
      color: #0b130e !important;
    }

    .hero-annida .btn-outline {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      color: #ffffff !important;
      border-radius: 8px !important;
    }
    .hero-annida .btn-outline:hover {
      background: rgba(255, 255, 255, 0.15) !important;
    }

    .divider {
      margin: 1.5rem 0;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 1rem;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .hero-annida {
        justify-content: center;
        padding-right: 0;
        background-position: center;
      }
      .hero-overlay-annida {
        background: rgba(0, 0, 0, 0.65); /* Dark full cover on mobile */
      }
      .hero-annida .login-card {
        width: 90%;
        max-width: 380px;
        padding: 30px 20px !important;
      }
    }
  </style>
  <link rel="stylesheet" href="../../css/mobile.css" />
</head>
<body>
  <section class="hero-annida">
    <!-- Gradient Overlay (Darker on the right for login card contrast) -->
    <div class="hero-overlay-annida"></div>

    <!-- Portal Login Card (Right side) -->
    <div class="glass-panel login-card">
      <img src="../../1.png" alt="Logo Annida" class="login-logo">
      <h2 class="login-title">PPDB Portal</h2>
      <p class="login-subtitle">Silakan masuk ke portal pendaftaran Annida2PPDB.</p>
      
      <form action="#" method="POST" id="loginForm">
        <div style="margin-bottom: 1.2rem; text-align: left;">
          <label style="display: block; margin-bottom: 0.5rem;">Alamat Email</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="user@email.com atau admin@annida.com" required style="width: 100%; padding: 0.8rem 1rem;">
        </div>
        <div style="margin-bottom: 1.5rem; text-align: left;">
          <label style="display: block; margin-bottom: 0.5rem;">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password Anda" required style="width: 100%; padding: 0.8rem 1rem;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1.05rem; cursor: pointer;">
          Masuk
        </button>
        
        <div class="form-footer" style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
          <p style="color: rgba(255, 255, 255, 0.7); margin-bottom: 0.5rem;">Lupa password? <a href="#" style="color: #00c853; font-weight: 500;">Klik di sini</a></p>
          <p style="color: rgba(255, 255, 255, 0.7);">Belum punya akun? <a href="register.html" style="color: #00c853; font-weight: 500;">Daftar Sekarang</a></p>
        </div>
      </form>
    </div>
  </section>

  <script type="module">
    import { setupThemeToggle, applySavedTheme } from '../../js/core/utils.js';
    applySavedTheme();
    setupThemeToggle();
  </script>
</body>
</html>
