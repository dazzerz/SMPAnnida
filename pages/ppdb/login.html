<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Annida2PPDB</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    /* =========================================================================
       CLEAN SPLIT-SCREEN PORTAL LAYOUT
       ========================================================================= */
    .hero-annida {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    .split-left {
      width: 45%;
      background-image: url('../../assets/images/gedung_sekolah.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .split-right {
      width: 55%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      overflow-y: auto;
    }

    /* Minimalist Portal Login Card Container (Blending with White Background) */
    .hero-annida .login-card {
      width: 100%;
      max-width: 380px;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      padding: 0 !important;
      margin: 0;
    }

    .hero-annida .login-logo {
      height: 60px;
      width: auto;
      margin-bottom: 1.5rem;
      display: block;
      object-fit: contain;
      margin-left: 0; /* Left align on split screen */
    }

    .hero-annida .login-title {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a !important; /* Dark Slate */
      margin-bottom: 0.5rem;
      text-align: left;
    }
    
    .hero-annida .login-subtitle {
      color: #475569 !important; /* Slate Grey */
      margin-bottom: 2rem;
      text-align: left;
      font-size: 1rem;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .split-left {
        display: none !important; /* Hide image section on mobile */
      }
      .split-right {
        width: 100% !important;
        padding: 30px 20px;
      }
      .hero-annida .login-card {
        padding: 10px !important;
      }
    }
  </style>
  <link rel="stylesheet" href="../../css/mobile.css" />
</head>
<body>
  <section class="hero-annida">
    <!-- Left Side: Clean Natural Image -->
    <div class="split-left"></div>

    <!-- Right Side: Clean White Login Form -->
    <div class="split-right">
      <div class="login-card">
        <img src="../../1.png" alt="Logo Annida" class="login-logo">
        <h1 class="login-title">Portal PPDB</h1>
        <p class="login-subtitle">Silakan masuk menggunakan akun pendaftaran Anda untuk melanjutkan registrasi calon siswa baru SMP Annida.</p>
        
        <form action="#" method="POST" id="loginForm">
          <div style="margin-bottom: 1.2rem; text-align: left;">
            <label style="display: block; margin-bottom: 0.5rem; color: #475569; font-weight: 500; font-size: 0.9rem;">Alamat Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="user@email.com atau admin@annida.com" required style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; font-size: 1rem; transition: border-color 0.2s;" onfocus="this.style.borderColor='#00c853'" onblur="this.style.borderColor='#cbd5e1'">
          </div>
          <div style="margin-bottom: 1.5rem; text-align: left;">
            <label style="display: block; margin-bottom: 0.5rem; color: #475569; font-weight: 500; font-size: 0.9rem;">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password Anda" required style="width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; font-size: 1rem; transition: border-color 0.2s;" onfocus="this.style.borderColor='#00c853'" onblur="this.style.borderColor='#cbd5e1'">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1.05rem; border-radius: 8px; margin-bottom: 1rem; background-color: #00c853; color: white; border: none; font-weight: 600; cursor: pointer; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#009624'" onmouseout="this.style.backgroundColor='#00c853'">
            Masuk
          </button>
          
          <div class="form-footer" style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
            <p style="color: #475569; margin-bottom: 0.5rem;">Lupa password? <a href="#" style="color: #00c853; font-weight: 500;">Klik di sini</a></p>
            <p style="color: #475569;">Belum punya akun? <a href="register.html" style="color: #00c853; font-weight: 500;">Daftar Sekarang</a></p>
          </div>
        </form>
      </div>
    </div>
  </section>

  <script type="module">
    import { setupThemeToggle, applySavedTheme } from '../../js/core/utils.js';
    applySavedTheme();
    setupThemeToggle();
  </script>
</body>
</html>
