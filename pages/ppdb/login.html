<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Annida2PPDB</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    /* =========================================================================
       CLEAN SPLIT-SCREEN GLASSMORPHISM PORTAL LAYOUT (SPLIT DESIGN)
       ========================================================================= */
    .login-page {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    .login-left {
      width: 50%;
      background: 
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url('../../assets/images/gedung_sekolah.jpg') center / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8%;
      color: #ffffff;
    }

    .login-left h1 {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      text-shadow: 0 4px 15px rgba(0,0,0,0.6);
      color: #ffffff !important;
    }

    .login-left p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.9) !important;
      max-width: 460px;
      line-height: 1.6;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .login-right {
      width: 50%;
      background: 
        linear-gradient(rgba(10, 18, 14, 0.65), rgba(10, 18, 14, 0.75)),
        url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?w=1920&q=80') center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
    }

    .glass-card {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
      text-align: center;
      color: #ffffff;
    }

    .glass-card h2 {
      color: #ffffff;
      margin-bottom: 4px;
    }

    .glass-card label {
      display: block;
      text-align: left;
      margin-bottom: 6px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
    }

    .glass-card input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.08) !important;
      border: 1px solid rgba(255,255,255,0.2) !important;
      border-radius: 10px;
      color: #ffffff !important;
      font-size: 1rem;
      outline: none;
    }

    .glass-card input::placeholder {
      color: rgba(255,255,255,0.4) !important;
    }

    .glass-card input:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 3px rgba(0,200,83,0.2);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: #00c853;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-login:hover {
      background: #009624;
    }

    .divider {
      margin: 20px 0;
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
    }

    .btn-guest {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #00c853;
      border: 1px solid #00c853;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-guest:hover {
      background: rgba(0, 200, 83, 0.1);
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .login-page {
        flex-direction: column;
      }
      .login-left {
        width: 100% !important;
        height: 38vh;
        padding: 2rem 1.5rem;
        text-align: center;
        align-items: center;
      }
      .login-left h1 {
        font-size: 2.2rem;
        margin-bottom: 0.5rem;
      }
      .login-left p {
        font-size: 0.95rem;
        max-width: 100%;
      }
      .login-right {
        width: 100% !important;
        height: 62vh;
        padding: 1.5rem !important;
      }
      .glass-card {
        padding: 30px 20px;
        max-width: 380px;
      }
    }
  </style>
  <link rel="stylesheet" href="../../css/mobile.css" />
  <script type="module">
    import { setupThemeToggle, applySavedTheme } from '../../js/core/utils.js';
    applySavedTheme();
    setupThemeToggle();
  </script>
</head>
<body>
<div class="login-page">
  <div class="login-left">
    <h1>Selamat Datang<br>di Portal PPDB SMP Annida</h1>
    <p>Silakan masuk menggunakan akun pendaftaran Anda untuk melanjutkan registrasi calon siswa baru SMP Annida.</p>
  </div>
  <div class="login-right">
    <div class="glass-card">
      <img src="../../1.png" alt="Logo" style="width:60px; margin-bottom:16px;">
      <h2>PPDB Portal</h2>
      <p style="margin-bottom:24px; opacity:0.7;">Silakan masuk ke portal Annida2PPDB.</p>
      <form>
        <label>Email</label>
        <input type="email" placeholder="user@email.com atau admin@annida.com">
        <label>Password</label>
        <input type="password" placeholder="••••••••">
        <button type="submit" class="btn-login">Masuk</button>
        <div class="divider"><span>Atau</span></div>
        <button type="button" class="btn-guest" onclick="window.location.href='register.html'">Daftar Sekarang</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
