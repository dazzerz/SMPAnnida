<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Annida2PPDB</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .login-page {
      display: flex;
      height: 100vh;
      width: 100%;
      background: 
        linear-gradient(to right, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.75) 100%),
        url('../../assets/images/gedung_sekolah.jpg') top center / cover no-repeat;
      background-color: #0a1a0f;
    }

    .login-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8%;
    }

    .login-left h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 1rem;
      text-shadow: 0 2px 15px rgba(0,0,0,0.5);
    }

    .login-left p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.8);
      max-width: 400px;
    }

    .login-right {
      width: 480px;
      min-width: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .glass-card {
      width: 100%;
      padding: 40px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      text-align: center;
      color: #ffffff;
    }

    .glass-card h2 {
      color: #ffffff;
      margin-bottom: 4px;
    }

    .glass-card label {
      display: block;
      text-align: left;
      margin-bottom: 6px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
    }

    .glass-card input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }

    .glass-card input::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .glass-card input:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 3px rgba(0,200,83,0.2);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: #00c853;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .divider {
      margin: 20px 0;
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
    }

    .btn-guest {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #00c853;
      border: 1px solid #00c853;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .login-page {
        flex-direction: column;
        background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.85)), url('../../assets/images/gedung_sekolah.jpg') center bottom / cover no-repeat;
      }
      .login-left {
        text-align: center;
        padding: 3rem 1.5rem 1.5rem;
      }
      .login-left h1 {
        font-size: 2.2rem;
      }
      .login-right {
        width: 100% !important;
        padding: 0 2rem 3rem !important;
      }
      .glass-card {
        max-width: 380px;
      }
    }
  </style>
  <link rel="stylesheet" href="../../css/mobile.css" />
  <script type="module">
    import { setupThemeToggle, applySavedTheme } from '../../js/core/utils.js';
    applySavedTheme();
    setupThemeToggle();
  </script>
</head>
<body>
<div class="login-page">
  <div class="login-left">
    <h1>Selamat Datang<br>di Portal PPDB SMP Annida</h1>
    <p>Silakan masuk menggunakan akun pendaftaran Anda untuk melanjutkan registrasi calon siswa baru SMP Annida.</p>
  </div>
  <div class="login-right">
    <div class="glass-card">
      <img src="../../1.png" alt="Logo" style="width:60px; margin-bottom:16px;">
      <h2>PPDB Portal</h2>
      <p style="margin-bottom:24px; opacity:0.7;">Silakan masuk ke portal Annida2PPDB.</p>
      <form>
        <label>Email</label>
        <input type="email" placeholder="user@email.com atau admin@annida.com">
        <label>Password</label>
        <input type="password" placeholder="••••••••">
        <button type="submit" class="btn-login">Masuk</button>
        <div class="divider"><span>Atau</span></div>
        <button type="button" class="btn-guest" onclick="window.location.href='register.html'">Daftar Sekarang</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
