<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SMPAnnida Super App</title>
  <meta name="description" content="Satu gerbang untuk PPDB, Akademik, dan Keuangan." />
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .login-logo {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .login-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: white;
    }
    .login-subtitle {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    #google-login-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      border-radius: 50px;
      margin-bottom: 1rem;
    }
    .divider {
      margin: 1.5rem 0;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      font-size: 0.9rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
      margin: 0 1rem;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="glass-panel login-card">
      <div class="login-logo">🏫</div>
      <h1 class="login-title">SMPAnnida Portal</h1>
      <p class="login-subtitle">Satu gerbang untuk Akademik, PPDB, dan Keuangan.</p>
      
      <button class="btn btn-primary" id="google-login-btn">
        <span>🌐</span> Masuk dengan Google
      </button>

      <div class="divider">Atau</div>

      <button class="btn btn-outline" style="width:100%;padding:1rem;border-radius:50px;" id="guest-login-btn">
        Masuk Tanpa Login (Guest)
      </button>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    import { handleLogin, handleGuestLogin } from './js/core/auth.js';
    
    document.getElementById('google-login-btn').addEventListener('click', handleLogin);
    
    // Fallback for guest login
    const guestBtn = document.getElementById('guest-login-btn');
    if (guestBtn) {
      guestBtn.addEventListener('click', () => {
        if (handleGuestLogin) {
          handleGuestLogin();
        } else {
          sessionStorage.setItem('guest_mode_active', 'true');
          window.location.href = 'index.html';
        }
      });
    }
  </script>
</body>
</html>
