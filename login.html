<!DOCTYPE html>
<html lang="id">
<head>
  <script>
    (function() {
      var t = localStorage.getItem('smpannida_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SMP Annida Portal</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b1320;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .hero-wrapper {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
    }

    .building-mask {
      position: absolute;
      top: 0; left: 0;
      width: 60%;
      height: 100%;
      z-index: 1;
      display: flex;
      align-items: center;
      padding-left: 5%;
    }

    .hero-text {
      color: white;
      max-width: 500px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
    .hero-text h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .hero-text p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .login-right-area {
      position: absolute;
      top: 0; right: 0;
      width: 45%;
      height: 100%;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-right: 5%;
    }

    .glass-login {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: rgba(16, 26, 20, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      text-align: center;
      color: white;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .glass-login input {
      width: 100%; padding: 14px; margin-bottom: 1.5rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px; color: white; outline: none;
      transition: all 0.3s ease;
      font-size: 1rem;
    }
    .glass-login input:focus {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.1);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
    }
    .glass-login input::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .glass-login button.btn-submit {
      width: 100%; padding: 14px;
      background: #16a34a; color: white;
      border: none; border-radius: 50px; font-weight: bold; font-size: 1.1rem;
      box-shadow: 0 0 20px rgba(22, 163, 74, 0.5);
      cursor: pointer; transition: 0.3s;
      margin-top: 0.5rem;
    }
    .glass-login button.btn-submit:hover {
      background: #15803d;
      box-shadow: 0 0 25px rgba(22, 163, 74, 0.8);
      transform: translateY(-1px);
    }

    .login-header {
       display: flex;
       align-items: center;
       gap: 15px;
       margin-bottom: 1.5rem;
    }
    .login-header img {
       width: 45px;
       height: auto;
       object-fit: contain;
    }
    .login-header h2 {
       font-size: 1.6rem;
       font-weight: 700;
       color: #ffffff;
    }

    @media (max-width: 768px) {
      .hero-wrapper {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }
      .building-mask {
        position: relative;
        top: 0; left: 0;
        width: 100%;
        height: 35vh;
        padding: 4rem 1.5rem 1rem;
        text-align: center;
        justify-content: center;
      }
      .hero-text {
        text-align: center;
      }
      .hero-text h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      .hero-text p {
        font-size: 0.95rem;
      }
      .login-right-area {
        position: relative;
        top: 0; right: 0;
        width: 100%;
        height: auto;
        min-height: 65vh;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .glass-login {
        padding: 30px 20px;
        max-width: 100%;
        border-radius: 20px;
      }
    }
  </style>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="./css/theme.css">
  <style>
    body { animation: pageFadeIn 0.3s ease-out forwards; }
    @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .page-fade-out { opacity: 0 !important; transition: opacity 0.3s ease-out !important; }
  </style>
  <script type="module">
    import { handleLogin } from './js/core/auth.js?v=2';
    import { bindThemeSwitcher } from './js/core/theme.js';
    
    document.addEventListener('DOMContentLoaded', () => {
      bindThemeSwitcher('theme-toggle-btn');

      const submitBtn = document.querySelector('.btn-submit');
      if (submitBtn) {
        submitBtn.addEventListener('click', handleLogin);
      }

      // Enter key submits form
      const form = document.querySelector('form');
      if (form) {
        form.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleLogin(e);
          }
        });
      }
    });
  </script>
  <script>
    window.smoothRedirect = function(url) {
      document.body.classList.add('page-fade-out');
      setTimeout(() => { window.location.href = url; }, 300);
    };
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function(e) {
          const href = this.getAttribute('href');
          if (href && !href.startsWith('javascript') && this.target !== '_blank' && new URL(this.href, window.location.href).pathname !== window.location.pathname) {
            e.preventDefault();
            window.smoothRedirect(this.href);
          }
        });
      });
    });
    window.addEventListener('pageshow', function (event) {
      if (event.persisted || document.body.classList.contains('page-fade-out')) {
        document.body.classList.remove('page-fade-out');
      }
    });
  </script>
</head>
<body>

  <div class="hero-wrapper">
      
      <!-- Tombol Kembali -->
      <a href="index.html" style="position: absolute; top: 2rem; left: 2rem; z-index: 10; display: flex; align-items: center; gap: 8px; color: white; text-decoration: none; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 50px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); transition: 0.3s; font-family: sans-serif; font-size: 0.95rem;" onmouseover="this.style.background='rgba(0,0,0,0.8)'" onmouseout="this.style.background='rgba(0,0,0,0.5)'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Kembali ke Portal
      </a>

      <!-- Theme Toggle Button -->
      <button id="theme-toggle-btn" class="theme-toggle-btn" style="position: absolute; top: 2rem; right: 2rem; z-index: 10; cursor: pointer; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px; border-radius: 50%; backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; transition: 0.3s;" aria-label="Ganti Mode Tema" title="Ganti Mode Terang / Gelap">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </button>
      
    <!-- AREA KIRI -->
    <div class="building-mask">
      <div class="hero-text">
        <h1>Selamat Datang di<br>Portal SMP Annida</h1>
        <p>Akses terpadu untuk layanan akademik dan administrasi sekolah.</p>
      </div>
    </div>

    <!-- AREA KANAN -->
    <div class="login-right-area">
      <div class="glass-login">
        
        <div class="login-header">
           <img src="assets/logo/1.png" alt="Logo SMP Annida" onerror="this.onerror=null; this.src='/assets/logo/1.png';">
           <h2>SMPAnnida Portal</h2>
        </div>
        
        <p style="font-size: 0.85rem; opacity: 0.7; margin-bottom: 2rem; margin-top: -0.5rem; text-align: left;">Silakan masuk menggunakan akun resmi Anda.</p>
        
        <div id="auth-message"></div>

        <form>
          <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; opacity: 0.8; text-align: left;">Email / No. WhatsApp (Khusus Wali Murid)</label>
          <input type="text" id="login-email" placeholder="contoh@email.com atau 08123456789" required autocomplete="username">
          
          <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; opacity: 0.8; text-align: left;">Password</label>
          <input type="password" placeholder="••••••••" required autocomplete="current-password">
          
          <button type="button" class="btn-submit">Masuk</button>
        </form>

        <div style="margin-top: 1.5rem; font-size: 0.85rem; opacity: 0.8; text-align: center;">
          <span>Belum mendaftar PPDB? </span>
          <a href="pages/ppdb/register.html" style="color: #22c55e; font-weight: bold; text-decoration: underline;">Daftar Sekarang</a>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
